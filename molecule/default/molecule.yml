---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ns1
    hostname: ns1
    docker_networks:
      - name: bind
        ipam_config:
          - subnet: "10.11.0.0/16"
            gateway: "10.11.0.254"
    networks:
      - name: bind
        ipv4_address: "10.11.0.1"
    image: "geerlingguy/docker-${MOLECULE_DISTRO}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${PWD}:/etc/ansible/roles/bertvv.bind:ro
      - ${PWD}/library:/root/.ansible/plugins/modules:ro
    privileged: true
    pre_build_image: true
    tty: true
    environment:
      container: docker
  - name: ns2
    hostname: ns2
    networks:
      - name: bind
        ipv4_address: "10.11.0.2"
    image: "geerlingguy/docker-${MOLECULE_DISTRO}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${PWD}:/etc/ansible/roles/bertvv.bind:ro
      - ${PWD}/library:/root/.ansible/plugins/modules:ro
    privileged: true
    pre_build_image: true
    tty: true
    environment:
      container: docker
  - name: ns3
    hostname: ns3
    networks:
      - name: bind
        ipv4_address: "10.11.0.3"
    image: "geerlingguy/docker-${MOLECULE_DISTRO}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${PWD}:/etc/ansible/roles/bertvv.bind:ro
      - ${PWD}/library:/root/.ansible/plugins/modules:ro
    privileged: true
    pre_build_image: true
    tty: true
    environment:
      container: docker
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_legacy_silent
      callback_whitelist: profile_tasks
    ssh_connection:
      pipelining: true
verifier:
  name: ansible
